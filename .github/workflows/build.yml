
name: Build ZELQUORIN for iPad

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q ZELQUORIN-OS-iPad-Edition-0.3.zip

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test arithmetic
        working-directory: ZELQUORIN-iPad-Edition
        run: |
          swiftc ZELQUORIN/Arithmetic.swift Tests/main.swift -o /tmp/zelquorin-tests
          /tmp/zelquorin-tests

      - name: Build ZELQUORIN
        working-directory: ZELQUORIN-iPad-Edition
        run: |
          xcodebuild \
            -project ZELQUORIN.xcodeproj \
            -scheme ZELQUORIN \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R ZELQUORIN-iPad-Edition/build/Build/Products/Release-iphoneos/ZELQUORIN.app Payload/
          zip -qry ZELQUORIN-iPad-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZELQUORIN-iPad-unsigned
          path: ZELQUORIN-iPad-unsigned.ipa
